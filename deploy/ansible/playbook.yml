# Converges the headless ingest box to the state docs/box-operations.html
# documents. Idempotent; safe to re-run any time. No sudo: everything runs as
# the box user (by design there is no passwordless sudo on the box).
#
#   on the box:      ansible-playbook -i deploy/ansible/inventory_local.ini \
#                        deploy/ansible/playbook.yml
#   from elsewhere:  ansible-playbook -i deploy/ansible/inventory.ini \
#                        deploy/ansible/playbook.yml
#   add --check --diff for a dry run
#
# The two inventories are the same host. inventory.ini reaches it over the
# `headless` SSH alias, which lives in a workstation's ~/.ssh/config and does
# not resolve on the box; inventory_local.ini connects locally instead.
- name: Crack the Sky ingest box
  hosts: headless
  gather_facts: true
  vars:
    repo_dir: "{{ ansible_facts['env']['HOME'] }}/crack-the-sky"
    repo_url: git@github.com:bradlasater/Crack-the-Sky.git
    data_root: /data/massive
    runner_dir: "{{ ansible_facts['env']['HOME'] }}/actions-runner"
    user_unit_dir: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
  handlers:
    - name: daemon-reload user units
      ansible.builtin.command: systemctl --user daemon-reload

    - name: re-arm massive job timers
      # daemon-reload alone does not recompute an active timer's next elapse
      # from a changed OnCalendar; restarting the timers does, and restarting a
      # timer is harmless (Persistent=false means nothing is owed).
      ansible.builtin.shell: >-
        systemctl --user list-units --all --no-legend --plain 'massive-*.timer'
        | awk '{print $1}'
        | xargs --no-run-if-empty systemctl --user restart

    - name: restart actions-runner
      ansible.builtin.command: systemctl --user restart actions-runner.service

  tasks:
    - name: Repo checkout tracks main
      # venv/ and .env live untracked inside the checkout; the git module
      # leaves untracked files alone.
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: main
        update: true

    - name: Data root must exist (created once by hand; needs root)
      ansible.builtin.stat:
        path: "{{ data_root }}"
      register: data_root_stat

    - name: Fail loudly if the data root is missing
      ansible.builtin.fail:
        msg: >-
          {{ data_root }} does not exist. Create it once:
          sudo mkdir -p {{ data_root }} && sudo chown $USER {{ data_root }}
      when: not data_root_stat.stat.exists

    - name: venv exists
      ansible.builtin.command:
        cmd: python3 -m venv {{ repo_dir }}/venv
        creates: "{{ repo_dir }}/venv/bin/python"

    - name: Editable install (deps via requirements.txt; imports path-independent)
      ansible.builtin.pip:
        name: "{{ repo_dir }}"
        editable: true
        virtualenv: "{{ repo_dir }}/venv"

    - name: Schedule definition (one canonical file for the timers)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../schedule.json"
        name: schedule
      tags: [timers]

    - name: System timezone is America/New_York (OnCalendar fires in local time)
      # Timers have no per-unit timezone: they elapse in the system's local
      # time. The schedule is written in ET, so a box reimaged to UTC would
      # fire every job hours off -- fail loudly instead.
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: system_timezone
      changed_when: false
      failed_when: system_timezone.stdout != "America/New_York"
      tags: [timers]

    - name: User unit directory exists
      ansible.builtin.file:
        path: "{{ user_unit_dir }}"
        state: directory
        mode: "0755"
      tags: [timers]

    - name: Job service units generated from schedule.json
      ansible.builtin.template:
        src: massive-job.service.j2
        dest: "{{ user_unit_dir }}/{{ item.unit }}.service"
        mode: "0644"
      loop: "{{ schedule.units }}"
      notify:
        - daemon-reload user units
        - re-arm massive job timers
      tags: [timers]

    - name: Job timer units generated from schedule.json
      ansible.builtin.template:
        src: massive-job.timer.j2
        dest: "{{ user_unit_dir }}/{{ item.unit }}.timer"
        mode: "0644"
      loop: "{{ schedule.units }}"
      notify:
        - daemon-reload user units
        - re-arm massive job timers
      tags: [timers]

    - name: Failure-alert template unit (OnFailure hook for the job services)
      ansible.builtin.template:
        src: massive-alert@.service.j2
        dest: "{{ user_unit_dir }}/massive-alert@.service"
        mode: "0644"
      notify:
        - daemon-reload user units
      tags: [timers]

    - name: Job timers enabled and started
      # Idempotent state assertion; the box.yml "Timer drift" step verifies the
      # rendered files and that every timer is loaded.
      ansible.builtin.command: systemctl --user enable --now {{ item.unit }}.timer
      loop: "{{ schedule.units }}"
      changed_when: false
      tags: [timers]

    - name: Unit changes land before the old schedule goes
      # Handlers otherwise flush at the end of the play, which would put
      # `crontab -r` ahead of the daemon-reload that arms the units this
      # converge just wrote.
      ansible.builtin.meta: flush_handlers

    - name: Repo crontab removed (the timers above own the schedule)
      # Last, deliberately: the crontab was the schedule before the timers and
      # stayed installed alongside them through the cutover overlap so that a
      # timer problem could not stop collection. It only comes off once this
      # play has put the timers in place and started them, so no converge can
      # leave the box with neither schedule on it. The overlap baked clean over
      # 2026-09-08/09 -- 421 of 421 sweeps on every chain both days, and one
      # flock skip per scheduled fire per job, which is exactly the second path
      # losing the race.
      #
      # Only a crontab this repo installed is removed: `crontab -r` wipes the
      # whole table, so refuse to run it over one carrying a schedule line that
      # does not go through scripts/cronjob.sh. The leading assignments
      # (TZ, REPO, PY, LOG) are this repo's own and go with it.
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          current="$(crontab -l 2>/dev/null || true)"
          [ -n "$current" ] || { echo "absent"; exit 0; }
          if printf '%s\n' "$current" | grep -E '^[0-9*@]' | grep -qv 'scripts/cronjob.sh'; then
            echo "refusing: crontab schedules a job this repo did not install" >&2
            exit 1
          fi
          crontab -r
          echo "removed"
        executable: /bin/bash
      register: crontab_removal
      changed_when: crontab_removal.stdout == "removed"
      tags: [timers]

    - name: Linger state
      ansible.builtin.command: loginctl show-user {{ ansible_facts['env']['USER'] }} -p Linger --value
      register: linger_state
      changed_when: false

    - name: Linger enabled (user services survive logout/reboot)
      # No failed_when override: without linger the runner dies at
      # logout/reboot, so a failure here must fail the play, not hide.
      ansible.builtin.command: loginctl enable-linger
      when: linger_state.stdout != "yes"

    - name: Actions runner present?
      ansible.builtin.stat:
        path: "{{ runner_dir }}/run.sh"
      register: runner_stat

    - name: Runner user unit installed
      ansible.builtin.copy:
        dest: "{{ user_unit_dir }}/actions-runner.service"
        content: |
          [Unit]
          Description=GitHub Actions self-hosted runner (Crack the Sky)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=%h/actions-runner
          ExecStart=%h/actions-runner/run.sh
          EnvironmentFile=%h/crack-the-sky/.env
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=default.target
      when: runner_stat.stat.exists
      notify:
        - daemon-reload user units
        - restart actions-runner

    - name: Runner is enabled and active
      ansible.builtin.command: systemctl --user enable --now actions-runner.service
      when: runner_stat.stat.exists
      changed_when: false
