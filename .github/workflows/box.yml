name: box

# Live checks that need what GitHub-hosted runners cannot have: the API key,
# the S3 credentials and the real /data/massive tree. Runs on a self-hosted
# Actions runner on the ingest box (free on private repos -- minutes billing
# applies only to GitHub-hosted runners). Replaces Buildkite. Pure offline
# correctness lives in ci.yml and is not duplicated beyond the same fast gate.
#
# The daily schedule is the point -- it is what turns coverage_audit into an
# alarm. Times are UTC; 22:17 UTC lands mid-afternoon ET, after the day's
# capture (incl. the 16:35 EOD sweep) has settled. coverage_audit checks T-1.
#
# Runner setup (once, on the box): ~/actions-runner holds the runner,
# configured against this repo and started by the user-level systemd unit
# ~/.config/systemd/user/actions-runner.service (ExecStart=run.sh; no sudo
# needed, linger enabled). The unit sets
#   EnvironmentFile=%h/crack-the-sky/.env
# so the job sees the credentials.

on:
  # Runs on every push and PR. Accepted risk (documented, solo repo): the
  # runner's service environment holds the Massive API/S3 keys, so pushed code
  # executes next to those credentials and /data/massive. Mitigants: private
  # repo with a single owner (only the owner can push), the keys are read-only
  # market-data credentials -- no brokerage access or money movement is
  # reachable from this box -- and the checks themselves are read-only. The
  # real gate is the GitHub account's 2FA, not the trigger list.
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 22 * * *" # daily, after the 16:35 ET EOD sweep
  workflow_dispatch:

concurrency:
  group: box-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Credentials present
        # Fail fast with a clear message instead of six confusing 401s.
        run: |
          : "${MASSIVE_API_KEY:?runner env missing MASSIVE_API_KEY -- set EnvironmentFile on the runner service}"
          : "${MASSIVE_S3_ACCESS_KEY_ID:?runner env missing MASSIVE_S3_ACCESS_KEY_ID}"
          : "${MASSIVE_S3_SECRET_ACCESS_KEY:?runner env missing MASSIVE_S3_SECRET_ACCESS_KEY}"

      - name: Bootstrap venv
        run: |
          test -x venv/bin/python || python3 -m venv venv
          venv/bin/pip install --quiet --upgrade pip
          venv/bin/pip install --quiet -r requirements-dev.txt

      - name: Offline gate
        run: |
          venv/bin/ruff check ingest marketdata pricing signals tests scripts
          venv/bin/python -m compileall -q ingest marketdata pricing signals
          venv/bin/python -m pytest tests/

      - name: Live entitlement probes
        # Asserts the documented entitlement map still holds and that entitled
        # endpoints return parseable payloads, so a downgrade or vendor
        # migration shows up as a red build rather than months of quiet 403s.
        run: venv/bin/python -m ingest.entitlements

      - name: No repo crontab installed
        # The crontab was the pre-timer schedule and was removed once the
        # timers had baked (2026-09-10). The timers are now the only path, so
        # a crontab that comes back -- restored from a backup, re-installed
        # from an old checkout by hand -- would double every job's fire. The
        # locks in scripts/cronjob.sh would absorb it silently, so nothing
        # else on the box would say so. Match on the wrapper rather than on
        # the whole file: an unrelated personal crontab entry is not this
        # repo's business.
        run: |
          if crontab -l 2>/dev/null | grep -q "scripts/cronjob.sh"; then
            echo "::error::a repo crontab is installed -- the systemd timers own the schedule now; run 'crontab -r'"
            crontab -l | grep "scripts/cronjob.sh"
            exit 1
          fi

      - name: Timer drift
        # The generated user units must match a fresh render of
        # deploy/schedule.json, and every timer must be loaded by systemd.
        # ansible-core is installed into the CI venv only (it is a no-op when
        # already present); the units are rendered by the same templates the
        # install playbook uses. This used to skip itself when no massive timer
        # was installed, so that a red build could not block the PR that
        # installed them. That escape hatch is gone with the crontab: the
        # timers are the only schedule now, so a box with no timers on it is
        # a box that has stopped collecting, and it should be loud.
        run: |
          if ! ls "$HOME"/.config/systemd/user/massive-*.timer >/dev/null 2>&1; then
            echo "::error::no massive timers installed -- the box is not collecting; run the install playbook"
            exit 1
          fi
          venv/bin/pip install --quiet ansible-core
          rm -rf /tmp/massive-units-rendered
          venv/bin/ansible-playbook deploy/ansible/render_units.yml -e out_dir=/tmp/massive-units-rendered
          venv/bin/python - <<'EOF'
          import json
          import pathlib
          import subprocess
          import sys

          schedule = json.loads(pathlib.Path("deploy/schedule.json").read_text())
          rendered = pathlib.Path("/tmp/massive-units-rendered")
          installed = pathlib.Path.home() / ".config" / "systemd" / "user"
          failed = False

          names = [f"{u['unit']}.{ext}" for u in schedule["units"] for ext in ("service", "timer")]
          names.append("massive-alert@.service")
          for name in names:
              got = installed / name
              if not got.exists():
                  print(f"MISSING: {got}")
                  failed = True
                  continue
              diff = subprocess.run(
                  ["diff", "-u", str(rendered / name), str(got)],
                  capture_output=True, text=True,
              )
              if diff.returncode:
                  print(diff.stdout)
                  failed = True

          timers = subprocess.run(
              ["systemctl", "--user", "list-timers", "--all", "--no-legend", "--plain"],
              capture_output=True, text=True,
          ).stdout
          for u in schedule["units"]:
              timer = f"{u['unit']}.timer"
              if timer not in timers:
                  print(f"NOT LOADED: {timer}")
                  failed = True

          sys.exit(1 if failed else 0)
          EOF

      - name: Coverage audit (T-1)
        # The gate that matters on the daily scheduled run: did yesterday's
        # session actually land everything it should have? A gap here is
        # exactly the thing this workflow exists to make loud.
        run: venv/bin/python -m ingest.jobs.coverage_audit
