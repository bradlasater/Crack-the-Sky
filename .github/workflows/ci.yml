name: CI

# Offline correctness gate. Runs on every push and PR, with no API key and no
# /data/massive, so it can only exercise the fixture tests -- which is exactly
# what is wanted for reviewing your own PRs. Anything needing live credentials
# or the real data tree runs on the Buildkite agent instead (.buildkite/).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check ingest tests

      - name: Syntax check
        run: python -m compileall -q ingest

      - name: Tests
        # No MASSIVE_API_KEY on purpose: any test that reaches the network
        # should fail here rather than pass silently against live data.
        env:
          DATA_ROOT: ${{ runner.temp }}/massive
          TZ_NAME: America/New_York
        run: pytest tests/
