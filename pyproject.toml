# The repo runs as `python -m ingest.jobs.<name>`; it is also installable
# (`pip install -e .`) so imports do not depend on the current directory.
# Runtime deps are pinned in requirements.txt and referenced dynamically
# below -- keep versions there, not here.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-the-sky"
version = "0.1.0"
description = "Massive.com options ingestion and SPY/SPX pricing stack"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
include = ["ingest*", "marketdata*", "pricing*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", "**/__pycache__"]

[tool.ruff.lint]
# Matches the style already in the source (typed, __future__ annotations,
# explicit `# noqa: BLE001` on the deliberate top-level exception guards).
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "SIM105",  # contextlib.suppress is not clearer in these try/except blocks
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
