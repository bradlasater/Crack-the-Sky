# Buildkite pipeline: bradlasater/data-ingest-infra
#
# Runs on a self-hosted agent on the ingest box, which has what GitHub Actions
# cannot have -- the API key, the S3 credentials and the real /data/massive
# tree. Everything here is a check that needs one of those. Pure offline
# correctness lives in .github/workflows/ci.yml and is not duplicated.
#
# Trigger: the GitHub webhook, plus a daily scheduled build. The scheduled
# build is the point -- it is what turns coverage_audit into an alarm.
#
# Agent setup (once, on the box):
#   sudo systemctl enable --now buildkite-agent
#   # agent env needs: MASSIVE_API_KEY, MASSIVE_S3_*, DATA_ROOT
#   # simplest: EnvironmentFile=/home/brad-lasater/data_ingest_infra/.env

env:
  REPO_VENV: "venv/bin/python"

steps:
  - label: ":package: bootstrap venv"
    key: bootstrap
    command:
      - test -x venv/bin/python || python3 -m venv venv
      - venv/bin/pip install --quiet --upgrade pip
      - venv/bin/pip install --quiet -r requirements-dev.txt

  - label: ":lock: offline tests"
    key: offline
    depends_on: bootstrap
    command:
      - venv/bin/ruff check ingest tests
      - venv/bin/python -m compileall -q ingest
      - venv/bin/python -m pytest tests/

  - wait

  - label: ":satellite: live entitlement smoke"
    key: smoke
    depends_on: offline
    # 6 live checks against the REST API and the flat-file bucket. Fails if a
    # plan change or vendor migration silently revokes something.
    command: venv/bin/python -m ingest.smoke

  - label: ":mag: entitlement probe"
    key: entitlements
    depends_on: offline
    # Asserts the documented entitlement map still holds, so a downgrade shows
    # up as a red build rather than months of quiet 403s.
    command: venv/bin/python -m ingest.entitlements

  - label: ":calendar: crontab drift"
    key: crondrift
    depends_on: offline
    # The installed crontab must match the repo (modulo the $HOME rewrite).
    command:
      - sed "s|/home/brad-lasater|$HOME|g" deploy/crontab > /tmp/expected.crontab
      - diff <(crontab -l) /tmp/expected.crontab

  - wait

  - label: ":bar_chart: coverage audit (T-1)"
    key: coverage
    # The gate that matters on the daily scheduled build: did yesterday's
    # session actually land everything it should have?
    # Deliberately NOT soft_fail: a gap in yesterday's capture is exactly the
    # thing this whole pipeline exists to make loud.
    command: venv/bin/python -m ingest.jobs.coverage_audit
